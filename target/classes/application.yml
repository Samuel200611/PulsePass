spring:
  application:
    name: pulsepass

  datasource:
    url: ${DB_URL:jdbc:postgresql://localhost:5432/pulsepass}
    username: ${DB_USER:postgres}
    password: ${DB_PASSWORD:postgres}

  jpa:
    hibernate:
      # Restriccion tecnica del PRD: Hibernate NUNCA crea ni modifica el
      # esquema. Solo valida que las entidades coincidan con lo que
      # construyo Flyway. Cualquier divergencia detiene el arranque.
      ddl-auto: validate
    open-in-view: false
    properties:
      hibernate:
        format_sql: true

  flyway:
    # NFR-002 / NFR-003: Flyway es el unico responsable del esquema.
    enabled: true
    locations: classpath:db/migration
    baseline-on-migrate: false

logging:
  level:
    org.hibernate.SQL: DEBUG
    org.flywaydb: INFO
